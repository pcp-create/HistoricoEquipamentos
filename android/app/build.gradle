plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'app.rjcompressores.tecnico'
    compileSdk 36
    defaultConfig {
        applicationId 'app.rjcompressores.tecnico'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '2.2.5'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
android {
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/portalAssets')
    testOptions.unitTests.includeAndroidResources = true
}
tasks.register('buildPortalAssets', Exec) {
    workingDir rootProject.file('../web')
    commandLine 'node', 'scripts/build-native.mjs'
}
tasks.named('preBuild').configure { dependsOn 'buildPortalAssets' }
